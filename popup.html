<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AIP/AIC Summarizer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --error: #ef4444;
      --border-color: #334155;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      margin: 0;
      padding: 16px;
      width: 400px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .options-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
      cursor: pointer;
    }

    .options-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .url-display {
      font-size: 12px;
      color: var(--text-muted);
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn:disabled {
      background-color: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .status-container {
      margin-top: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
      border: 1px dashed var(--border-color);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    .result-container {
      margin-top: 16px;
      display: none;
      max-height: 350px;
      overflow-y: auto;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      line-height: 1.6;
    }

    .result-container h2, .result-container h3 {
      color: #60a5fa;
      margin-top: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .result-container ul {
      margin: 8px 0;
      padding-left: 20px;
    }

    .result-container li {
      margin-bottom: 6px;
    }

    .result-container strong {
      color: #34d399;
    }

    .error-container {
      display: none;
      margin-top: 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* AI Selector */
    .ai-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }

    .ai-selector label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .ai-toggle {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .ai-toggle-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .ai-toggle-btn:hover {
      border-color: var(--primary);
      color: var(--text-color);
    }

    .ai-toggle-btn.active-deepseek {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
    }

    .ai-toggle-btn.active-gemini {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #60a5fa;
    }

    .ai-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .badge-deepseek {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #10b981;
    }

    .badge-gemini {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #3b82f6;
    }

    .badge-none {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid #ef4444;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Extractor Link Items */
    .extractor-link-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.2s;
      margin-bottom: 2px;
    }

    .extractor-link-item:hover {
      border-color: var(--primary);
      background: rgba(15, 23, 42, 0.6);
    }

    .extractor-link-item input[type="checkbox"] {
      margin-top: 3px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .extractor-link-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-color);
      word-break: break-all;
      cursor: pointer;
    }

    .extractor-link-url {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 330px;
    }
  </style>
  <script src="pdf.min.js"></script>
</head>
<body>
  <div class="header">
    <h1>AIP/AIC Summarizer</h1>
    <a id="optionsLink" class="options-link">Settings</a>
  </div>

  <div id="urlDisplay" class="url-display">Detecting document...</div>

  <!-- HTML Link Extractor Panel -->
  <div id="extractorPanel" style="display: none; margin-bottom: 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px;">
    <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 14px; color: #60a5fa; display: flex; align-items: center; gap: 6px;">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="color: #34d399;">
        <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z"/>
      </svg>
      AIP Portal Detected
    </h3>
    <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">Select the publications to analyze in Batch Workspace:</p>
    <div id="extractedLinksList" style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; padding-right: 4px;">
      <!-- Dynamically populated checklist -->
    </div>
    <button id="importSelectedBtn" class="btn" style="background-color: var(--accent); color: white;">
      <span>Import to Batch Workspace</span>
    </button>
  </div>

  <!-- AI Provider Quick Selector -->
  <div class="ai-selector" id="aiSelectorGroup">
    <label>AI:</label>
    <div class="ai-toggle">
      <button class="ai-toggle-btn" id="aiAutoBtn" title="Use DeepSeek if key available, otherwise Gemini">Auto</button>
      <button class="ai-toggle-btn" id="aiDeepSeekBtn" title="Force DeepSeek">DeepSeek</button>
      <button class="ai-toggle-btn" id="aiGeminiBtn" title="Force Gemini">Gemini</button>
    </div>
    <span id="aiBadge" class="ai-badge badge-none">No key</span>
  </div>

  <button id="summarizeBtn" class="btn" disabled>
    <span>Summarize Document</span>
  </button>

  <button id="batchBtn" class="btn" style="margin-top: 8px; background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color);">
    <span>Open Batch Processor</span>
  </button>

  <div id="statusContainer" class="status-container">
    <div class="spinner"></div>
    <div id="statusText" class="status-text">Preparing...</div>
  </div>

  <div id="errorContainer" class="error-container"></div>

  <div id="resultContainer" class="result-container"></div>

  <script src="popup.js"></script>
</body>
</html>
